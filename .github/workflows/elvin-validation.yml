name: Elvin validation (no APK distribution)
on:
  push:
    branches: [custom-aaps]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elvin-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew
      - run: ./gradlew -p tools/elvin-policy-tests test --no-daemon
      - run: node --test tools/elvin-research/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elvin-policy-test-results
          path: tools/elvin-policy-tests/build/test-results
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37'
      - run: chmod +x gradlew
      - name: Compile and test changed Android modules without assembling APKs
        run: >-
          ./gradlew :implementation:testAndroidHostTest :core:keys:testAndroidHostTest
          :plugins:constraints:testAndroidHostTest :ui:compileAndroidMain
          :pump:omnipod:dash:compileDebugKotlin
          --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs='-Xmx3g -Xss4m'
          -Pkotlin.daemon.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elvin-android-test-results
          path: |
            implementation/build/test-results
            core/keys/build/test-results
            plugins/constraints/build/test-results
