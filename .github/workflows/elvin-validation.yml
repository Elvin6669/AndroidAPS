name: Elvin validation (no APK distribution)
on:
  push:
    branches: [custom-aaps]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elvin-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: chmod +x gradlew
      - run: ./gradlew -p tools/elvin-policy-tests test --no-daemon
      - run: node --test tools/elvin-research/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elvin-policy-test-results
          path: tools/elvin-policy-tests/build/test-results
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: chmod +x gradlew
      - name: Compile and test changed Android modules without assembling APKs
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew :implementation:testAndroidHostTest :core:keys:testAndroidHostTest \
              :plugins:constraints:testAndroidHostTest :ui:compileAndroidMain \
              :pump:omnipod:dash:compileDebugKotlin :app:compileFullDebugKotlin -PfirebaseDisable \
              --no-daemon --continue --max-workers=3 \
              -Dorg.gradle.jvmargs='-Xmx3g -Xss4m' -Pkotlin.daemon.jvmargs=-Xmx4g \
              2>&1 | tee android-validation.log; then
              exit 0
            fi
            # Retry transient dependency failures only; source/test failures remain failures.
            if ! python3 -c "import re,sys; sys.exit(not re.search(r'Received status code (429|502|503)|Read timed out|Connection reset', open('android-validation.log').read()))"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 20))"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elvin-android-test-results
          path: |
            implementation/build/test-results
            core/keys/build/test-results
            plugins/constraints/build/test-results
